<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0f0a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Expense Tracker</title>
  
  <link rel="manifest" href="manifest.json">
  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <!-- Preload Chart.js -->
  <link rel="preload" href="js/utils/chart.js" as="script">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
    </div>
    <div class="loading-text">Expense Tracker</div>
    <div class="loading-sub">Loading your data...</div>
    <div class="loading-spinner"></div>
  </div>

  <!-- Offline Banner -->
  <div id="offline-banner">You are offline. Working in local mode.</div>

  <div id="app">
    <!-- Main Content Area (Pages) -->
    <main id="main-content">
      <div id="page-dashboard" class="page"></div>
      <div id="page-transactions" class="page"></div>
      <div id="page-categories" class="page"></div>
      <div id="page-reports" class="page"></div>
      <div id="page-settings" class="page"></div>
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav"></nav>
    
    <!-- Floating Action Button -->
    <div id="fab-menu"></div>
    <button id="fab"></button>
  </div>

  <!-- Scripts -->
  <script src="js/utils/chart.js"></script>
  <script type="module" src="js/app.js"></script>


</body>
</html>
