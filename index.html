<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0f0a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Expense Tracker</title>
  
  <link rel="manifest" href="/manifest.json">
  <!-- CSS -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
  
  <!-- Preload Chart.js -->
  <link rel="preload" href="/js/utils/chart.js" as="script">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
    </div>
    <div class="loading-text">Expense Tracker</div>
    <div class="loading-sub">Loading your data...</div>
    <div class="loading-spinner"></div>
  </div>

  <!-- Offline Banner -->
  <div id="offline-banner">You are offline. Working in local mode.</div>

  <div id="app">
    <!-- Main Content Area (Pages) -->
    <main id="main-content">
      <div id="page-dashboard" class="page"></div>
      <div id="page-transactions" class="page"></div>
      <div id="page-categories" class="page"></div>
      <div id="page-reports" class="page"></div>
      <div id="page-settings" class="page"></div>
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav"></nav>
    
    <!-- Floating Action Button -->
    <div id="fab-menu"></div>
    <button id="fab"></button>
  </div>

  <!-- Install Prompt -->
  <div id="install-prompt">
    <div class="install-prompt-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </div>
    <div class="install-prompt-text">
      <div class="install-prompt-title">Install App</div>
      <div class="install-prompt-sub">Add to home screen for offline use</div>
    </div>
    <div class="install-actions">
      <button class="btn btn-ghost btn-sm" id="install-dismiss">Not now</button>
      <button class="btn btn-primary btn-sm" id="install-confirm">Install</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/utils/chart.js"></script>
  <script type="module" src="/js/app.js"></script>

  <script>
    // Handle PWA Install Prompt
    let deferredPrompt;
    const installPrompt = document.getElementById('install-prompt');
    const dismissBtn = document.getElementById('install-dismiss');
    const confirmBtn = document.getElementById('install-confirm');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      
      // Check if user previously dismissed
      if (localStorage.getItem('et_install_dismissed') !== 'true') {
        setTimeout(() => {
          installPrompt.classList.add('show');
        }, 3000);
      }
    });

    dismissBtn.addEventListener('click', () => {
      installPrompt.classList.remove('show');
      localStorage.setItem('et_install_dismissed', 'true');
    });

    confirmBtn.addEventListener('click', async () => {
      installPrompt.classList.remove('show');
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Install prompt outcome:', outcome);
        deferredPrompt = null;
      }
    });

    window.addEventListener('appinstalled', () => {
      installPrompt.classList.remove('show');
      deferredPrompt = null;
      console.log('PWA installed');
    });
  </script>
</body>
</html>
